org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
# AAPT2-Ressourcen-Pfadverkuerzung (res/mipmap-hdpi/ic_launcher.png -> res/-B.png)
# aus, sonst findet fdroidserver's dichte-basierte Icon-Extraktion (die auf
# konventionelle mipmap-<density>-Ordnernamen im Pfad angewiesen ist) keine
# Launcher-Icons mehr im Release-Build.
android.enableResourceOptimizations=false
# s.o. -- AGP markiert die Option als deprecated, aber es gibt (Stand AGP 9.3)
# keinen Ersatz mit demselben Effekt. Warnung bewusst unterdrueckt statt die
# Option zu entfernen.
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE
